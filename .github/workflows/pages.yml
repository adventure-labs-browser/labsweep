name: pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/export.rs"
      - "src/db.rs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["daily"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Resolve database snapshot
        id: db
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "release_id=$(gh api repos/${{ github.repository }}/releases/tags/db-latest --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Restore cached viewer dataset
        id: viewer-cache
        uses: actions/cache@v4
        with:
          path: web/data
          key: labsweep-pages-data-${{ steps.db.outputs.release_id }}-${{ hashFiles('src/export.rs', 'src/db.rs') }}

      - name: Free disk space
        if: steps.viewer-cache.outputs.cache-hit != 'true'
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true

      - uses: dtolnay/rust-toolchain@stable
        if: steps.viewer-cache.outputs.cache-hit != 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.viewer-cache.outputs.cache-hit != 'true'

      - name: Build exporter
        if: steps.viewer-cache.outputs.cache-hit != 'true'
        run: cargo build --release --locked

      - name: Restore latest database
        if: steps.viewer-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          gh release download db-latest -p 'labsweep.db.zst.part-*' --clobber
          cat labsweep.db.zst.part-* | zstd -dc -o data/labsweep.db
          rm -f labsweep.db.zst.part-*
          ls -lh data/labsweep.db

      - name: Export viewer dataset
        if: steps.viewer-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf web/data
          ./target/release/labsweep --db data/labsweep.db export --out web/data

      - name: Build balanced recent-changes index
        run: python3 scripts/build_changes.py web/data

      - name: Validate viewer dataset
        run: |
          test -s web/data/catalog.json.gz
          test -s web/data/meta.json.gz
          test -d web/data/detail
          test -d web/data/history
          python3 - <<'PY'
          import gzip, json
          with gzip.open('web/data/catalog.json.gz', 'rt', encoding='utf-8') as f:
              catalog = json.load(f)
          incomplete = [x.get('g') for x in catalog if not x.get('f')]
          assert not incomplete, f"viewer catalog contains {len(incomplete)} discovery-only rows"
          PY
          touch web/.nojekyll
          du -sh web web/data
          find web/data/detail -type f -name '*.json.gz' | wc -l
          find web/data/history -type f -name '*.json.gz' | wc -l

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
