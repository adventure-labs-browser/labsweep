<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>labsweep — worldwide adventure labs</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2430; --border: #30363d;
    --text: #e6edf3; --dim: #8b949e; --accent: #58a6ff; --good: #3fb950;
    --warn: #d29922; --bad: #f85149;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #app { display: flex; height: 100%; }

  /* ── left panel ── */
  #side { width: 380px; min-width: 380px; display: flex; flex-direction: column;
    background: var(--panel); border-right: 1px solid var(--border); z-index: 5; }
  #hdr { padding: 10px 12px; border-bottom: 1px solid var(--border); }
  #hdr h1 { margin: 0; font-size: 15px; letter-spacing: .5px; }
  #hdr h1 span { color: var(--accent); }
  #stats { color: var(--dim); font-size: 12px; margin-top: 4px; }
  #search { width: 100%; margin-top: 8px; padding: 7px 9px; background: var(--panel2);
    border: 1px solid var(--border); border-radius: 6px; color: var(--text); outline: none; }
  #search:focus { border-color: var(--accent); }
  #quick { display: flex; gap: 5px; margin-top: 7px; }
  .mini-btn { flex: 1; background: var(--panel2); border: 1px solid var(--border); color: var(--dim);
    border-radius: 5px; padding: 4px 6px; cursor: pointer; font-size: 11px; }
  .mini-btn:hover { color: var(--text); border-color: var(--accent); }
  #fresh { color: var(--dim); font-size: 10.5px; margin-top: 5px; }
  #filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px;
    border-bottom: 1px solid var(--border); align-items: center; }
  #filters label { display: flex; align-items: center; gap: 4px; color: var(--dim);
    font-size: 11.5px; cursor: pointer; user-select: none; }
  #filters select, #filters input[type=number] { background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 5px; padding: 3px 5px; font-size: 11.5px; width: 64px; }
  #filters select { width: auto; }
  #sortbar { display: flex; gap: 4px; padding: 6px 12px; border-bottom: 1px solid var(--border);
    align-items: center; font-size: 11.5px; color: var(--dim); }
  .sortbtn { background: var(--panel2); border: 1px solid var(--border); color: var(--dim);
    border-radius: 5px; padding: 2px 8px; cursor: pointer; font-size: 11.5px; }
  .sortbtn.on { color: var(--text); border-color: var(--accent); }
  #count { margin-left: auto; color: var(--dim); }
  #list { flex: 1; overflow-y: auto; position: relative; }
  #spacer { width: 1px; }
  .row { position: absolute; left: 0; right: 0; padding: 7px 12px; border-bottom: 1px solid var(--border);
    cursor: pointer; overflow: hidden; }
  .row:hover { background: var(--panel2); }
  .row .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .s { color: var(--dim); font-size: 11.5px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; margin-top: 1px; }
  .row .s b { color: var(--warn); font-weight: 500; }
  .row .s .hr { color: var(--good); }
  .row .s .ac { color: var(--good); font-weight: 600; }
  .row.unf { opacity: .45; }

  /* ── map ── */
  #map { flex: 1; position: relative; }
  .maplibregl-ctrl-attrib { font-size: 10px; }
  #mapmode { position: absolute; top: 10px; left: 10px; z-index: 5; display: flex;
    background: var(--panel); border: 1px solid var(--border); border-radius: 7px;
    overflow: hidden; opacity: .92; }
  #mapmode button { background: transparent; border: none; color: var(--dim);
    padding: 5px 10px; font-size: 11.5px; cursor: pointer; }
  #mapmode button + button { border-left: 1px solid var(--border); }
  #mapmode button.on { background: var(--panel2); color: var(--text); }

  /* ── detail drawer ── */
  #drawer { position: absolute; top: 0; right: 0; bottom: 0; width: 460px; max-width: 92vw;
    background: var(--panel); border-left: 1px solid var(--border); z-index: 10;
    transform: translateX(105%); transition: transform .18s ease; overflow-y: auto; }
  #drawer.open { transform: none; }
  #dhead { position: sticky; top: 0; background: var(--panel); padding: 12px 14px;
    border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-start; }
  #dhead h2 { margin: 0; font-size: 16px; flex: 1; }
  #dshare { background: none; border: 1px solid var(--border); color: var(--dim); border-radius: 6px;
    height: 28px; padding: 0 8px; cursor: pointer; flex: none; }
  #dshare:hover { color: var(--text); border-color: var(--accent); }
  #dclose { background: none; border: 1px solid var(--border); color: var(--dim); border-radius: 6px;
    width: 28px; height: 28px; cursor: pointer; flex: none; }
  #dclose:hover { color: var(--text); }
  #dimg { width: 100%; max-height: 200px; object-fit: cover; display: block; }
  .dsec { padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .dsec h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .8px;
    color: var(--dim); }
  .kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 6px 14px; }
  .kv div { font-size: 12px; }
  .kv .k { color: var(--dim); display: block; font-size: 10.5px; text-transform: uppercase; }
  #ddesc, .stage .sd { font-size: 12.5px; color: var(--text); overflow-wrap: break-word; }
  #ddesc a, .stage .sd a { color: var(--accent); }
  #ddesc img, .stage .sd img { max-width: 100%; border-radius: 6px; }
  #ddesc p, .stage .sd p { margin: 6px 0; }
  .stage { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px; margin-bottom: 8px; transition: border-color .18s, box-shadow .18s; }
  .stage.focus { border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(88,166,255,.28), 0 0 22px rgba(88,166,255,.18); }
  .stage .st { font-weight: 600; font-size: 13px; }
  .stage .sq { margin-top: 6px; font-size: 12.5px; }
  .stage .ans { margin-top: 6px; font-size: 13px; color: var(--good); }
  .stage .ans .chip { color: var(--dim); border-color: var(--border); }
  .stage .sq .q { color: var(--accent); }
  .stage .sm { margin-top: 6px; font-size: 11px; color: var(--dim); word-break: break-all; }
  .stage .sm code { color: var(--warn); }
  .rev { padding: 8px 0; border-top: 1px solid var(--border); }
  .rev:first-child { border-top: none; }
  .rev .rh { font-size: 11.5px; color: var(--dim); }
  .rev .rh b { color: var(--text); }
  .rev .stars { color: var(--warn); }
  .rev .rt { font-size: 12.5px; margin-top: 3px; white-space: pre-wrap; }
  .rev img { max-width: 90px; border-radius: 6px; margin: 4px 4px 0 0; }
  .hist { padding: 8px 0; border-top: 1px solid var(--border); }
  .hist:first-child { border-top: none; }
  .hist .hh { display: flex; gap: 7px; align-items: center; font-size: 11.5px; }
  .hist .when { color: var(--dim); margin-left: auto; white-space: nowrap; }
  .hist details { margin-top: 5px; color: var(--dim); }
  .hist pre { max-height: 280px; overflow: auto; white-space: pre-wrap; word-break: break-word;
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px;
    color: var(--text); font-size: 10.5px; }
  .change-row { padding: 8px 0; border-top: 1px solid var(--border); cursor: pointer; }
  .change-row:hover { color: var(--accent); }
  .change-row small { display: block; color: var(--dim); }
  .change-controls { position: sticky; top: 0; z-index: 2; display: flex; gap: 10px;
    align-items: center; justify-content: space-between; padding: 7px 0 9px;
    background: var(--panel); border-bottom: 1px solid var(--border); font-size: 11.5px; color: var(--dim); }
  .change-controls label { cursor: pointer; }
  #sellegend { display: none; position: absolute; top: 48px; left: 10px; z-index: 5;
    background: rgba(22,27,34,.92); border: 1px solid var(--border); border-radius: 7px;
    padding: 6px 9px; font-size: 11px; color: var(--dim); pointer-events: none; }
  #sellegend.on { display: flex; gap: 10px; align-items: center; }
  #sellegend i { width: 10px; height: 10px; display: inline-block; border-radius: 50%;
    margin-right: 4px; vertical-align: -1px; border: 1.5px solid #0d1117; }
  #sellegend .main-dot { background: #58a6ff; box-shadow: 0 0 0 1px #fff; }
  #sellegend .stage-dot { background: #d29922; }
  .chip { display: inline-block; background: var(--panel2); border: 1px solid var(--border);
    border-radius: 10px; padding: 1px 8px; font-size: 10.5px; color: var(--dim); margin: 2px 2px 0 0; }
  #load { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: var(--bg); z-index: 50; flex-direction: column; gap: 12px; color: var(--dim); }
  #loadbar { width: 260px; height: 4px; background: var(--panel2); border-radius: 2px; overflow: hidden; }
  #loadbar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  @media (max-width: 800px) { #side { width: 300px; min-width: 300px; } }
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <div id="hdr">
      <h1>lab<span>sweep</span></h1>
      <div id="stats">loading…</div>
      <input id="search" placeholder="search title, owner, guid…" autocomplete="off">
      <div id="quick">
        <button class="mini-btn" id="near">near me</button>
        <button class="mini-btn" id="changes">recent changes</button>
        <button class="mini-btn" id="random">random</button>
        <button class="mini-btn" id="fit">fit</button>
        <button class="mini-btn" id="csv">export CSV</button>
      </div>
      <div id="fresh"></div>
    </div>
    <div id="filters">
      <select id="ftype">
        <option value="">all types</option>
        <option value="Sequential">sequential</option>
        <option value="Nonsequential">nonsequential</option>
      </select>
      <label>min★ <input type="number" id="fminr" min="0" max="5" step="0.5" value="0"></label>
      <label>stages≥ <input type="number" id="fminst" min="0" max="10" value="0"></label>
      <label>revs≥ <input type="number" id="fminrv" min="0" value="0"></label>
      <label><input type="checkbox" id="fhr"> ★rec</label>
      <label><input type="checkbox" id="ffetch"> fetched</label>
      <label><input type="checkbox" id="factive" checked> hide archived</label>
    </div>
    <div id="sortbar">
      sort
      <button class="sortbtn" data-k="ra">rating</button>
      <button class="sortbtn" data-k="vc">reviews</button>
      <button class="sortbtn" data-k="rc">ratings</button>
      <button class="sortbtn" data-k="sc">stages</button>
      <button class="sortbtn" data-k="p">newest</button>
      <span id="count"></span>
    </div>
    <div id="list"><div id="spacer"></div></div>
  </div>
  <div id="map">
    <div id="mapmode">
      <button data-m="cluster" class="on">clusters</button>
      <button data-m="heat">heat</button>
      <button data-m="all">all points</button>
    </div>
    <div id="sellegend"><span><i class="main-dot"></i>entry point</span><span><i class="stage-dot"></i>stage</span><span>ring = geofence</span></div>
  </div>
  <div id="drawer">
    <div id="dhead"><h2 id="dtitle"></h2><button id="dshare">copy link</button><button id="dclose">✕</button></div>
    <div id="dbody"></div>
  </div>
  <div id="load"><div>loading catalog…</div><div id="loadbar"><i></i></div><div id="loadmsg"></div></div>
</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="app.js"></script>
</body>
</html>
